<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- softened dawn: token colors muted toward neutral (wheat -> honey -> dusty clay) -->
    <linearGradient id="dawn" x1="0" y1="96" x2="0" y2="861" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0DFC0"/>
      <stop offset="0.5" stop-color="#D8B680"/>
      <stop offset="1" stop-color="#C48B6A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#E9B44C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#232946"/>

  <!-- construction guides -->
  <g fill="none" stroke="#D8B680" stroke-opacity="0.3" stroke-width="5">
    <circle cx="512" cy="481" r="471"/>
    <circle cx="512" cy="481" r="338"/>
    <circle cx="512" cy="481" r="184"/>
    <line x1="512" y1="0" x2="512" y2="1024" stroke-dasharray="24 18"/>
    <line x1="512" y1="7" x2="439.6" y2="139.4" stroke-dasharray="24 18"/>
    <line x1="512" y1="7" x2="584.4" y2="139.4" stroke-dasharray="24 18"/>
    <line x1="111.6" y1="738.4" x2="0" y2="942.3" stroke-dasharray="24 18"/>
    <line x1="912.4" y1="738.4" x2="1024" y2="942.3" stroke-dasharray="24 18"/>
  </g>
  <line x1="0" y1="778" x2="1024" y2="778" stroke="#D8B680" stroke-opacity="0.4" stroke-width="7"/>

  <!-- crosshair at the inner notch -->
  <g fill="none" stroke="#D8B680" stroke-opacity="0.42" stroke-width="6">
    <circle cx="512" cy="351" r="34"/>
    <line x1="512" y1="303" x2="512" y2="399"/>
    <line x1="464" y1="351" x2="560" y2="351"/>
  </g>

  <!-- the rise: pale wheat at the peak, honey gold through the legs, dusty clay at the ground -->
  <path d="M 184 778 L 512 179 L 840 778" fill="none" stroke="url(#dawn)"
        stroke-width="165" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
