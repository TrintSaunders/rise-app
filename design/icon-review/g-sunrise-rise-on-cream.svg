<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="dawn" x1="0" y1="95" x2="0" y2="835" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9B44C"/>
      <stop offset="1" stop-color="#E07A5F"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="575" x2="0" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3C86A"/>
      <stop offset="1" stop-color="#E9B44C"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="760" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9B44C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E9B44C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBF7EF"/>
      <stop offset="1" stop-color="#F1E9DB"/>
    </linearGradient>
    <clipPath id="above"><rect width="1024" height="760"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- the sun, rising from the horizon inside the rise -->
  <g transform="translate(0 44)">
  <circle cx="512" cy="760" r="300" fill="url(#halo)" clip-path="url(#above)"/>
  <path d="M 327 760 A 185 185 0 0 1 697 760 Z" fill="url(#sun)"/>
  <!-- the horizon -->
  <line x1="96" y1="760" x2="928" y2="760" stroke="#E07A5F" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
  <!-- the rise: dawn gold at the peak deepening to ember at the ground (Trint's chevron) -->
  <path d="M 190 760 L 512 170 L 834 760" fill="none" stroke="url(#dawn)"
        stroke-width="150" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
